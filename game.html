<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE DEFENSE // SYSTEM_OVERRIDE</title>
    <meta name="description" content="CORE DEFENSE：Charles 个人站内置的键盘防御小游戏。">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#050505">
    <link rel="canonical" href="https://kingston-115.github.io/game.html">
    <meta property="og:title" content="CORE DEFENSE // SYSTEM_OVERRIDE">
    <meta property="og:description" content="Charles 个人站内置的键盘防御小游戏。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kingston-115.github.io/game.html">
    <meta property="og:image" content="https://kingston-115.github.io/photos/IMG_5069.JPG">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CORE DEFENSE // SYSTEM_OVERRIDE">
    <meta name="twitter:description" content="Charles 个人站内置的键盘防御小游戏。">
    <meta name="twitter:image" content="https://kingston-115.github.io/photos/IMG_5069.JPG">

    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #ccff00; /* Acid Green */
            --danger-color: #ff2b2b;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }
        .hud-text {
            text-shadow: 0 0 10px var(--accent-color);
        }
        .danger-text {
            color: var(--danger-color);
            text-shadow: 0 0 10px var(--danger-color);
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 1rem 3rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2rem;
        }
        .btn:hover {
            background: var(--accent-color);
            color: black;
            box-shadow: 0 0 30px var(--accent-color);
        }
        .scanline {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.5) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="ui-layer">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-xs text-gray-500 mb-1">SYSTEM_INTEGRITY</div>
                <div class="w-64 h-4 border border-white/20 p-0.5">
                    <div id="healthBar" class="h-full bg-red-500 w-full transition-all duration-200"></div>
                </div>
            </div>
            <div class="text-right flex flex-col items-end gap-2">
                <div>
                    <div class="text-xs text-gray-500 mb-1">SCORE</div>
                    <div id="scoreDisplay" class="text-4xl font-bold hud-text text-[#ccff00]">000000</div>
                </div>
                <!-- Speed Control Module -->
                <div class="pointer-events-auto flex items-center gap-2 bg-black/40 p-2 border border-white/10 rounded">
                    <span class="text-[10px] text-gray-500 font-mono">VELOCITY_CTRL</span>
                    <input type="range" id="speedSlider" min="0.1" max="2" step="0.1" value="1" class="w-24 accent-[#ccff00] cursor-pointer">
                    <span id="speedValue" class="text-xs text-[#ccff00] font-mono w-8">1.0x</span>
                </div>
            </div>
        </div>
        <div class="flex justify-between items-end">
            <div class="text-xs text-gray-500">
                MODE: DEFENSE<br>
                TARGET: KEYBOARD_INPUT
            </div>
            <a href="index.html" class="pointer-events-auto text-gray-500 hover:text-white transition-colors">[ EXIT_SYSTEM ]</a>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="ui-layer" style="pointer-events: none; z-index: 15;">
        <div class="flex justify-center items-end h-full pb-20 md:hidden">
            <button id="keyboardBtn" class="pointer-events-auto border border-[#ccff00] text-[#ccff00] px-4 py-2 font-mono text-sm bg-black/50 backdrop-blur" onclick="activateKeyboard()">
                [ DEPLOY_KEYBOARD ]
            </button>
        </div>
    </div>
    
    <!-- Hidden Input for Mobile -->
    <input type="text" id="hiddenInput" style="position: absolute; opacity: 0; top: -1000px;">

    <!-- Start Screen -->
    <div id="startScreen">
        <h1 class="text-6xl font-bold mb-4 hud-text text-center">CORE DEFENSE</h1>
        <p class="text-gray-400 mb-8 max-w-md text-center">Intercept incoming data packets before they breach the system core.<br><br>Type the falling characters to destroy them.</p>
        <button class="btn" onclick="startGame()">INITIALIZE</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" style="display: none;">
        <h1 class="text-6xl font-bold mb-4 danger-text text-center">SYSTEM FAILURE</h1>
        <p class="text-gray-400 mb-2">FINAL SCORE</p>
        <div id="finalScore" class="text-5xl font-bold text-white mb-8">0</div>
        <button class="btn" onclick="location.reload()">REBOOT_SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        // Game State
        let gameRunning = false;
        let score = 0;
        let health = 100;
        let enemies = [];
        let particles = [];
        let spawnRate = 60; // Frames between spawns
        let difficultyMultiplier = 1;
        let frameCount = 0;

        // Characters to use
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Enemy {
            constructor() {
                this.char = chars[Math.floor(Math.random() * chars.length)];
                this.x = Math.random() * (width - 40) + 20;
                this.y = -20;
                this.speed = (Math.random() * 2 + 1) * difficultyMultiplier;
                this.size = 24;
            }

            update() {
                this.y += this.speed;
                if (this.y > height) {
                    health -= 10;
                    updateHealth();
                    return false; // Remove
                }
                return true; // Keep
            }

            draw() {
                ctx.font = 'bold 24px "JetBrains Mono"';
                ctx.fillStyle = '#ccff00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ccff00';
                ctx.fillText(this.char, this.x, this.y);
                ctx.shadowBlur = 0;
                
                // Trail effect
                ctx.fillStyle = 'rgba(204, 255, 0, 0.2)';
                ctx.fillText(this.char, this.x, this.y - 5);
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.color = '#ccff00';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.05;
                return this.life > 0;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 3, 3);
                ctx.globalAlpha = 1.0;
            }
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameRunning = true;
            loop();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('finalScore').innerText = score;
        }

        function updateHealth() {
            const bar = document.getElementById('healthBar');
            bar.style.width = health + '%';
            if (health <= 0) gameOver();
        }

        function createExplosion(x, y) {
            for(let i=0; i<8; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function loop() {
            if (!gameRunning) return;

            // Clear with trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);

            frameCount++;

            // Spawn enemies
            if (frameCount % Math.floor(spawnRate / difficultyMultiplier) === 0) {
                enemies.push(new Enemy());
            }

            // Increase difficulty
            if (frameCount % 600 === 0) {
                difficultyMultiplier += 0.1;
            }

            // Update & Draw Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (!e.update()) {
                    enemies.splice(i, 1);
                    // Shake screen slightly on damage
                    canvas.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
                    setTimeout(() => canvas.style.transform = 'none', 50);
                } else {
                    e.draw();
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if (!p.update()) {
                    particles.splice(i, 1);
                } else {
                    p.draw();
                }
            }

            requestAnimationFrame(loop);
        }

        // Input Handling
        const hiddenInput = document.getElementById('hiddenInput');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        speedSlider.addEventListener('input', (e) => {
            difficultyMultiplier = parseFloat(e.target.value);
            speedValue.innerText = difficultyMultiplier.toFixed(1) + 'x';
        });
        
        function activateKeyboard() {
            hiddenInput.focus();
        }

        hiddenInput.addEventListener('input', (e) => {
            if (!gameRunning) return;
            const char = e.data ? e.data.toUpperCase() : '';
            if (char) processInput(char);
            hiddenInput.value = ''; // Clear input
        });

        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            processInput(e.key.toUpperCase());
        });

        function processInput(key) {
            let hit = false;
            // Find matching enemy (closest to bottom first)
            const sortedIndices = enemies.map((e, i) => ({y: e.y, i})).sort((a, b) => b.y - a.y);
            
            for (let obj of sortedIndices) {
                if (enemies[obj.i].char === key) {
                    createExplosion(enemies[obj.i].x, enemies[obj.i].y);
                    enemies.splice(obj.i, 1);
                    score += 100;
                    document.getElementById('scoreDisplay').innerText = score.toString().padStart(6, '0');
                    hit = true;
                    break;
                }
            }
        }
    </script>
</body>
</html>
