<head>

    <!-- Compiled Tailwind utilities and global styles -->
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/global.css">

    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }
        .hud-text {
            text-shadow: 0 0 10px var(--accent-color);
        }
        .danger-text {
            color: var(--danger-color);
            text-shadow: 0 0 10px var(--danger-color);
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 1rem 3rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2rem;
        }
        .btn:hover {
            background: var(--accent-color);
            color: black;
            box-shadow: 0 0 30px var(--accent-color);
        }
        .scanline {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.5) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="ui-layer">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-xs text-gray-500 mb-1">SYSTEM_INTEGRITY</div>
                <div class="w-64 h-4 border border-white/20 p-0.5">
                    <div id="healthBar" class="h-full bg-red-500 w-full transition-all duration-200"></div>
                </div>
            </div>
            <div class="text-right flex flex-col items-end gap-2">
                <div>
                    <div class="text-xs text-gray-500 mb-1">SCORE</div>
                    <div id="scoreDisplay" class="text-4xl font-bold hud-text text-[#ccff00]">000000</div>
                </div>
                <!-- Speed Control Module -->
                <div class="pointer-events-auto flex items-center gap-2 bg-black/40 p-2 border border-white/10 rounded">
                    <span class="text-[10px] text-gray-500 font-mono">VELOCITY_CTRL</span>
                    <input type="range" id="speedSlider" min="0.1" max="2" step="0.1" value="1" class="w-24 accent-[#ccff00] cursor-pointer">
                    <span id="speedValue" class="text-xs text-[#ccff00] font-mono w-8">1.0x</span>
                </div>
            </div>
        </div>
        <div class="flex justify-between items-end">
            <div class="text-xs text-gray-500">
                MODE: DEFENSE<br>
                TARGET: KEYBOARD_INPUT
            </div>
            <a href="index.html" class="pointer-events-auto text-gray-500 hover:text-white transition-colors">[ EXIT_SYSTEM ]</a>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="ui-layer" style="pointer-events: none; z-index: 15;">
        <div class="flex justify-center items-end h-full pb-20 md:hidden">
            <button id="keyboardBtn" class="pointer-events-auto border border-[#ccff00] text-[#ccff00] px-4 py-2 font-mono text-sm bg-black/50 backdrop-blur" onclick="activateKeyboard()">
                [ DEPLOY_KEYBOARD ]
            </button>
        </div>
    </div>
    
    <!-- Hidden Input for Mobile -->
    <!-- 优化移动端唤起键盘：将其固定在左上角不可见，防止页面跳动 -->
    <input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           style="position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1;">

    <!-- Start Screen -->
    <div id="startScreen">
        <h1 class="text-6xl font-bold mb-4 hud-text text-center">CORE DEFENSE</h1>
        <p class="text-gray-400 mb-8 max-w-md text-center">Intercept incoming data packets before they breach the system core.<br><br>Type the falling characters to destroy them.</p>
        <button class="btn" onclick="startGame()">INITIALIZE</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" style="display: none;">
        <h1 class="text-6xl font-bold mb-4 danger-text text-center">SYSTEM FAILURE</h1>
        <p class="text-gray-400 mb-2">FINAL SCORE</p>
        <div id="finalScore" class="text-5xl font-bold text-white mb-8">0</div>
        <button class="btn" onclick="location.reload()">REBOOT_SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        // --- 1. Game State Management ---
        const GameState = {
            running: false,
            score: 0,
            health: 100,
            enemies: [],
            particles: [],
            spawnRate: 60, // Base frames between spawns
            difficultyMultiplier: 1,
            frameCount: 0,
            screenShake: 0, // 屏幕震动幅度
            
            reset() {
                this.score = 0;
                this.health = 100;
                this.enemies = [];
                this.particles = [];
                this.difficultyMultiplier = parseFloat(document.getElementById('speedSlider').value) || 1;
                this.frameCount = 0;
                this.screenShake = 0;
                updateHealthUI();
                updateScoreUI();
            },
            
            takeDamage(amount) {
                this.health -= amount;
                this.screenShake = 15; // 触发屏幕震动
                updateHealthUI();
                if (this.health <= 0) {
                    gameOver();
                }
            },
            
            addScore(amount) {
                this.score += amount;
                updateScoreUI();
            }
        };

        // Characters to use
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 2. Entity Classes ---
        class Enemy {
            constructor() {
                this.char = chars[Math.floor(Math.random() * chars.length)];
                this.size = 24;
                // 确保在屏幕内，避开边缘
                this.x = Math.random() * (width - 60) + 30;
                this.y = -20;
                // 根据当前难度和随机因子设定速度
                this.speed = (Math.random() * 2 + 1) * GameState.difficultyMultiplier;
            }

            update() {
                this.y += this.speed;
                if (this.y > height) {
                    GameState.takeDamage(10);
                    return false; // 移除
                }
                return true; // 保留
            }

            draw(ctx) {
                ctx.font = 'bold 24px "JetBrains Mono"';
                ctx.fillStyle = '#ccff00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ccff00';
                ctx.fillText(this.char, this.x, this.y);
                ctx.shadowBlur = 0;
                
                // Trail effect
                ctx.fillStyle = 'rgba(204, 255, 0, 0.2)';
                ctx.fillText(this.char, this.x, this.y - 5);
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.color = '#ccff00';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.05;
                return this.life > 0;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 3, 3);
                ctx.globalAlpha = 1.0;
            }
        }

        // --- 3. UI Interactions ---
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            GameState.reset();
            GameState.running = true;
            requestAnimationFrame(gameLoop);
            
            // 自动唤起键盘体验更好 (可选)
            // if (window.innerWidth < 768) activateKeyboard();
        }

        function gameOver() {
            GameState.running = false;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('finalScore').innerText = GameState.score;
            // 游戏结束收起键盘
            document.getElementById('hiddenInput').blur();
        }

        function updateHealthUI() {
            const bar = document.getElementById('healthBar');
            bar.style.width = Math.max(0, GameState.health) + '%';
        }
        
        function updateScoreUI() {
            document.getElementById('scoreDisplay').innerText = GameState.score.toString().padStart(6, '0');
        }

        function createExplosion(x, y) {
            for(let i=0; i<8; i++) {
                GameState.particles.push(new Particle(x, y));
            }
        }

        // --- 4. Main Game Loop ---
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!GameState.running) return;

            // Clear with trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);

            ctx.save(); // 保存当前上下文状态

            // 屏幕震动计算 (直接在 Canvas 层操作，不操作 DOM Transform)
            if (GameState.screenShake > 0) {
                const dx = (Math.random() - 0.5) * GameState.screenShake;
                const dy = (Math.random() - 0.5) * GameState.screenShake;
                ctx.translate(dx, dy);
                GameState.screenShake *= 0.9; // 衰减
                if (GameState.screenShake < 0.5) GameState.screenShake = 0;
            }

            GameState.frameCount++;

            // 动态计算生成率
            let currentSpawnRate = Math.max(10, Math.floor(GameState.spawnRate / GameState.difficultyMultiplier));
            if (GameState.frameCount % currentSpawnRate === 0) {
                GameState.enemies.push(new Enemy());
            }

            // 随时间增加难度
            if (GameState.frameCount % 600 === 0) {
                GameState.difficultyMultiplier += 0.1;
                // 同步更新 UI
                document.getElementById('speedSlider').value = GameState.difficultyMultiplier;
                document.getElementById('speedValue').innerText = GameState.difficultyMultiplier.toFixed(1) + 'x';
            }

            // Update & Draw Enemies
            for (let i = GameState.enemies.length - 1; i >= 0; i--) {
                let e = GameState.enemies[i];
                if (!e.update()) {
                    GameState.enemies.splice(i, 1);
                } else {
                    e.draw(ctx);
                }
            }

            // Update & Draw Particles
            for (let i = GameState.particles.length - 1; i >= 0; i--) {
                let p = GameState.particles[i];
                if (!p.update()) {
                    GameState.particles.splice(i, 1);
                } else {
                    p.draw(ctx);
                }
            }

            ctx.restore(); // 恢复上下文（清除 translate 影响）

            requestAnimationFrame(gameLoop);
        }

        // --- 5. Input Handling ---
        const hiddenInput = document.getElementById('hiddenInput');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        // 绑定手动难度控制
        speedSlider.addEventListener('input', (e) => {
            GameState.difficultyMultiplier = parseFloat(e.target.value);
            speedValue.innerText = GameState.difficultyMultiplier.toFixed(1) + 'x';
        });
        
        function activateKeyboard() {
            hiddenInput.focus();
            // 在某些移动端浏览器中，可能需要一点延迟来确保焦点生效
            setTimeout(() => hiddenInput.focus(), 100);
        }

        // 监听移动端输入 (隐藏输入框)
        hiddenInput.addEventListener('input', (e) => {
            if (!GameState.running) return;
            // 针对拼音输入法或某些手机键盘，尝试获取最新输入的字符
            const val = hiddenInput.value;
            if (val.length > 0) {
                const char = val[val.length - 1].toUpperCase();
                processInput(char);
                hiddenInput.value = ''; // 立即清空，准备下一次输入
            }
        });

        // 监听桌面端物理键盘
        window.addEventListener('keydown', (e) => {
            if (!GameState.running) return;
            // 忽略控制键，只处理单字符
            if (e.key.length === 1) {
                processInput(e.key.toUpperCase());
            }
        });

        function processInput(key) {
            // 找到所有屏幕上的敌人，按 Y 轴排序（最底部的优先匹配）
            const sortedIndices = GameState.enemies
                .map((e, i) => ({ y: e.y, i }))
                .sort((a, b) => b.y - a.y);
            
            for (let obj of sortedIndices) {
                if (GameState.enemies[obj.i].char === key) {
                    // 击中逻辑
                    createExplosion(GameState.enemies[obj.i].x, GameState.enemies[obj.i].y);
                    GameState.enemies.splice(obj.i, 1);
                    GameState.addScore(100);
                    break; // 一次按键只击毁最下面的一个字母
                }
            }
        }
    </script>
</body>
</html>
